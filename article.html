const db=supabase.createClient("https://ukrjmtcxmzgwsifynpqa.supabase.co","sb_publishable_RMKfGWv97JMNnNAkBulUUQ_gWEzzU_P");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function load(){let id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("article").textContent="Article not found.";return}let r=await db.from("news").select("*").eq("id",id).eq("published",true).single();if(r.error){document.getElementById("article").textContent="Article not found.";return}let n=r.data;document.title=n.title+" | Online News Network";document.getElementById("article").innerHTML=`<a class="back" href="index.html">← Back to Latest News</a><div class="tag">${esc(n.category)}</div><h1>${esc(n.title)}</h1><div class="meta">${new Date(n.created_at).toLocaleString()} · ${esc(n.author||"Online News Network")}</div>${n.image_url?`<img src="${esc(n.image_url)}" alt="${esc(n.title)}">`:''}<p class="text">${esc(n.content)}</p>`}load();
</script></body></html>
