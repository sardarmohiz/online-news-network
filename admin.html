<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONN Admin</title><style>
body{font-family:Arial;background:#f5f7fa;margin:0}.box{max-width:850px;margin:30px auto;background:white;padding:25px;border-radius:12px}input,textarea,select{width:100%;padding:11px;margin:7px 0 14px;box-sizing:border-box}textarea{min-height:160px}button{padding:11px 16px;background:#d71920;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.hidden{display:none}.msg{padding:10px;background:#f2f4f7;margin:10px 0}.news{border-top:1px solid #ddd;padding:15px 0}img{max-width:220px;max-height:140px}
</style></head><body>
<div class="box" id="login"><h1>Online News Network</h1><h2>Admin Login</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="lm"></div></div>
<div class="box hidden" id="dash"><button onclick="logout()" style="float:right">Logout</button><h1>Admin Dashboard</h1><div id="msg"></div><h2>Add / Edit News</h2><input id="eid" type="hidden"><label>Title</label><input id="title"><label>Category</label><select id="cat"><option>Pakistan</option><option>KPK</option><option>World</option><option>Sports</option><option>Business</option><option>Technology</option><option>Entertainment</option></select>
<label>News Image — choose from computer</label><input id="file" type="file" accept="image/*" onchange="preview()"><img id="prev" style="display:none">
<label>Excerpt</label><input id="excerpt"><label>Article</label><textarea id="content"></textarea>
<label><input id="breaking" type="checkbox" style="width:auto"> Breaking News</label><br><label><input id="featured" type="checkbox" style="width:auto"> Featured</label><br><br>
<button onclick="save()">Publish News</button><h2>News</h2><div id="list"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://ukrjmtcxmzgwsifynpqa.supabase.co","sb_publishable_RMKfGWv97JMNnNAkBulUUQ_gWEzzU_P");let user=null,oldImage=null;
const $=x=>document.getElementById(x);
async function init(){let r=await db.auth.getSession();user=r.data.session?.user||null;show();db.auth.onAuthStateChange((e,s)=>{user=s?.user||null;show()})}
function show(){$("login").classList.toggle("hidden",!!user);$("dash").classList.toggle("hidden",!user);if(user)load()}
async function login(){let r=await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});$("lm").textContent=r.error?r.error.message:""}
async function logout(){await db.auth.signOut()}
function preview(){let f=$("file").files[0];if(f){$("prev").src=URL.createObjectURL(f);$("prev").style.display="block"}}
async function upload(f){let ext=f.name.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";let path=user.id+"/"+Date.now()+"."+ext;let r=await db.storage.from("news-images").upload(path,f,{contentType:f.type});if(r.error)throw r.error;return db.storage.from("news-images").getPublicUrl(path).data.publicUrl}
async function save(){try{let image=oldImage,f=$("file").files[0];if(f)image=await upload(f);let p={title:$("title").value.trim(),excerpt:$("excerpt").value.trim(),content:$("content").value.trim(),category:$("cat").value,image_url:image||null,author:user.email,is_breaking:$("breaking").checked,is_featured:$("featured").checked,published:true};if(!p.title||!p.content)throw Error("Title and article are required.");let id=$("eid").value,r=id?await db.from("news").update(p).eq("id",id):await db.from("news").insert(p);if(r.error)throw r.error;$("msg").textContent="News published successfully.";clearForm();load()}catch(e){$("msg").textContent="Error: "+e.message}}
async function load(){let r=await db.from("news").select("*").order("created_at",{ascending:false});if(r.error){$("list").textContent=r.error.message;return}$("list").innerHTML=r.data.map(n=>`<div class="news"><b>${n.title}</b><br>${n.category}<br><button onclick='editNews(${JSON.stringify(n)})'>Edit</button> <button onclick="del(${n.id})">Delete</button></div>`).join("")||"No news yet."}
function editNews(n){$("eid").value=n.id;$("title").value=n.title;$("cat").value=n.category;$("excerpt").value=n.excerpt||"";$("content").value=n.content;$("breaking").checked=n.is_breaking;$("featured").checked=n.is_featured;oldImage=n.image_url||null;$("file").value=""}
async function del(id){if(confirm("Delete this news?")){let r=await db.from("news").delete().eq("id",id);if(r.error)$("msg").textContent=r.error.message;load()}}
function clearForm(){$("eid").value="";$("title").value="";$("excerpt").value="";$("content").value="";$("file").value="";$("prev").style.display="none";$("breaking").checked=false;$("featured").checked=false;oldImage=null}
init();
</script></body></html>
