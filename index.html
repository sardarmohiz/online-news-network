<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online News Network | Latest News</title>
<meta name="description" content="Online News Network — Pakistan, KPK, World, Sports, Business, Technology and Entertainment news.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#101828}
.wrap{width:94%;max-width:1180px;margin:auto}a{text-decoration:none;color:inherit}
.top{background:#111827;color:#fff;padding:8px 0;font-size:13px}.toprow{display:flex;justify-content:space-between}
header{background:#fff;padding:18px 0;border-bottom:1px solid #ddd}.brand{font-size:28px;font-weight:900}.brand b{color:#d71920}
nav{background:#d71920;color:#fff}.navrow{display:flex;overflow:auto}.navrow a{padding:13px 17px;font-weight:800;white-space:nowrap}.navrow a:hover{background:#b31319}
.breaking{background:#fff;border-bottom:1px solid #ddd}.ticker{display:flex;align-items:center;min-height:44px}.ticker strong{background:#111827;color:#fff;padding:11px 15px}.ticker span{padding-left:14px;font-weight:700}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin:22px 0}.lead{position:relative;background:#111827;color:#fff;min-height:350px;border-radius:12px;overflow:hidden}.lead img{width:100%;height:350px;object-fit:cover;opacity:.72}.overlay{position:absolute;bottom:0;left:0;right:0;padding:28px;background:linear-gradient(transparent,rgba(0,0,0,.9))}.tag{color:#d71920;font-weight:900;font-size:12px;text-transform:uppercase}.lead .tag{color:#ffb4b4}.lead h1{margin:8px 0;font-size:32px}
.side{display:grid;gap:18px}.sidecard{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}.sidecard img{width:100%;height:145px;object-fit:cover}.sidebody{padding:14px}.sidebody h2{margin:6px 0;font-size:19px}
.title{border-left:5px solid #d71920;padding-left:10px;margin:28px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden}.card img,.blank{width:100%;height:190px;object-fit:cover}.blank{background:#d0d5dd}.body{padding:16px}.body h2{margin:7px 0;font-size:20px}.excerpt{color:#475467;line-height:1.5}.meta{color:#667085;font-size:12px}
footer{margin-top:40px;background:#111827;color:#fff;padding:35px 0}.muted{color:#98a2b3}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.lead h1{font-size:25px}.toprow{display:block}}
</style></head><body>
<div class="top"><div class="wrap toprow"><span>Online News Network</span><span id="date"></span></div></div>
<header><div class="wrap"><div class="brand">ONLINE <b>NEWS</b> NETWORK</div></div></header>
<nav><div class="wrap navrow"><a href="index.html">HOME</a><a href="#Pakistan">PAKISTAN</a><a href="#KPK">KPK</a><a href="#World">WORLD</a><a href="#Sports">SPORTS</a><a href="#Business">BUSINESS</a><a href="#Technology">TECHNOLOGY</a><a href="#Entertainment">ENTERTAINMENT</a><a href="admin.html">ADMIN</a></div></nav>
<div class="breaking"><div class="wrap ticker"><strong>BREAKING</strong><span id="ticker">Loading latest headline...</span></div></div>
<main class="wrap"><div id="hero"></div><h2 class="title">Latest News</h2><div id="news" class="grid"></div></main>
<footer><div class="wrap"><div class="brand">ONLINE <b>NEWS</b> NETWORK</div><p class="muted">Pakistan, KPK and world news — Online News Network.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://ukrjmtcxmzgwsifynpqa.supabase.co","sb_publishable_RMKfGWv97JMNnNAkBulUUQ_gWEzzU_P");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const card=n=>`<a class="card" href="article.html?id=${n.id}">${n.image_url?`<img src="${esc(n.image_url)}" alt="">`:'<div class="blank"></div>'}<div class="body"><div class="tag">${esc(n.category)}</div><h2>${esc(n.title)}</h2><p class="excerpt">${esc(n.excerpt||"")}</p><div class="meta">${new Date(n.created_at).toLocaleString()}</div></div></a>`;
async function load(){let r=await db.from("news").select("*").eq("published",true).order("created_at",{ascending:false});if(r.error){document.getElementById("news").textContent=r.error.message;return}let d=r.data||[];document.getElementById("ticker").textContent=d[0]?.title||"Latest news from Online News Network";if(d[0]){let n=d[0];document.getElementById("hero").innerHTML=`<section class="hero"><a class="lead" href="article.html?id=${n.id}">${n.image_url?`<img src="${esc(n.image_url)}">`:''}<div class="overlay"><div class="tag">${esc(n.category)}</div><h1>${esc(n.title)}</h1><div>${esc(n.excerpt||"")}</div></div></a><div class="side">${d.slice(1,3).map(n=>`<a class="sidecard" href="article.html?id=${n.id}">${n.image_url?`<img src="${esc(n.image_url)}">`:''}<div class="sidebody"><div class="tag">${esc(n.category)}</div><h2>${esc(n.title)}</h2></div></a>`).join("")}</div></section>`}document.getElementById("news").innerHTML=d.map(card).join("")||"<p>No news published yet.</p>"}
document.getElementById("date").textContent=new Date().toLocaleDateString();load();
</script></body></html>
